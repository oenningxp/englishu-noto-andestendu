<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de uso da cota</title>
<link rel="icon" href="/icone-v2.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Painel do dono: quanto da cota diária grátis da Cloudflare (10.000 neurons) cada pessoa gastou */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1217);--ink:light-dark(#15171c,#eef0f4);--mute:light-dark(#5d6370,#9aa1ad);--line:light-dark(#e4e6eb,#262b34);--soft:light-dark(#f4f5f8,#171b22);--red:#d7263d;--blue:#2154d6;--ok:light-dark(#0b7a43,#4ad08a);--warn:light-dark(#b26a00,#ffb547)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px max(4vw,14px) 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:24px;margin:0;font-weight:800}h1 b{color:var(--red)}
h2{font-size:18px;margin:0 0 10px}
a,button.ib{font:600 14px Figtree,sans-serif;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.hero{background:var(--soft);border-radius:18px;padding:18px;display:grid;gap:10px}
.big{font-size:clamp(40px,10vw,64px);font-weight:800;line-height:1}
.big small{font-size:18px;color:var(--mute);font-weight:600;margin-left:8px}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.sub{color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.who b{display:block}.who span{font-size:13px;color:var(--mute)}
.mini{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}.mini i{display:block;height:100%;background:var(--red)}
.tasks{font-size:13px;color:var(--mute)}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.day .mini{height:12px}
.two{display:grid;gap:3px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.day.gm{grid-template-columns:110px 1fr 64px}.gm2{grid-column:1/-1;margin-top:-4px}
section.hero+section.hero{margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.msg{padding:14px;border-radius:12px;background:var(--soft)}
section{margin-top:26px}section.hero{margin-top:0}
@media(max-width:600px){.hide-s{display:none}td,th{padding:8px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Painel de uso <b>da cota</b></h1><div><button class="ib" id="reload">Atualizar</button> <a href="/">Voltar ao app</a></div></header>
  <div id="out" class="msg">Carregando…</div>
</div>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["#d7263d", "#2154d6", "#0b9f6e", "#e09b00", "#8a4fff", "#e0567a", "#0096b4", "#6b7a00", "#b45309", "#64748b"];
const fmt = n => Math.round(n).toLocaleString("pt-BR");
const pct = (n, f) => (n / f * 100);
const pctTxt = p => (p < 1 && p > 0 ? p.toFixed(1) : Math.round(p)) + "%";
function untilReset() {
  const now = new Date(), next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
  const m = Math.round((next - now) / 60000); return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`;
}
async function load() {
  const out = $("#out");
  try {
    const r = await fetch("/api/admin/usage?days=7", { credentials: "same-origin" });
    if (r.status === 401) { out.innerHTML = 'Entre no app com a sua conta primeiro. <a href="/">Ir para o app</a>'; return; }
    if (r.status === 403) { out.textContent = "Este painel é só do dono do app."; return; }
    const d = await r.json(); render(d);
  } catch { out.textContent = "Não consegui carregar agora. Tente de novo."; }
}
function render(d) {
  const { rows, names, free, today, groq = [], groqLimits = {}, groqMode } = d;
  const name = id => names[id] || { nick: "?", username: "?" };
  // ---- Groq (principal)
  const gToday = groq.filter(r => r.day === today);
  const gModel = {}; for (const r of gToday) { const m = gModel[r.model] || (gModel[r.model] = { amount: 0, calls: 0 }); m.amount += r.amount; m.calls += r.calls; }
  const TXT = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"];
  const gUser = new Map(); for (const r of gToday) { const u = gUser.get(r.user_id) || { id: r.user_id, tokens: 0, audio: 0, calls: 0 }; if (TXT.includes(r.model)) u.tokens += r.amount; else u.audio += r.amount; u.calls += r.calls; gUser.set(r.user_id, u); }
  // ---- Cloudflare (reserva)
  const todayRows = rows.filter(r => r.day === today);
  const byUser = new Map();
  for (const r of todayRows) { const u = byUser.get(r.user_id) || { id: r.user_id, neurons: 0, calls: 0, tasks: {} }; u.neurons += r.neurons; u.calls += r.calls; u.tasks[r.task] = (u.tasks[r.task] || 0) + r.neurons; byUser.set(r.user_id, u); }
  const cfUsers = [...byUser.values()];
  const total = cfUsers.reduce((a, u) => a + u.neurons, 0), totalPct = pct(total, free);
  // ---- pessoas (as duas)
  const ids = [...new Set([...gUser.keys(), ...byUser.keys()])];
  const tokLimit = (groqLimits["openai/gpt-oss-120b"] || { amount: 200000 }).amount;
  const people = ids.map(id => ({ id, g: gUser.get(id) || { tokens: 0, audio: 0, calls: 0 }, c: byUser.get(id) || { neurons: 0, calls: 0, tasks: {} } }))
    .sort((a, b) => (b.g.tokens / tokLimit + b.c.neurons / free) - (a.g.tokens / tokLimit + a.c.neurons / free));
  const color = new Map(people.map((p, i) => [p.id, COLORS[i % COLORS.length]]));
  const tone = p => p >= 90 ? "var(--red)" : p >= 60 ? "var(--warn)" : "var(--ok)";
  const gMax = Math.max(0, ...Object.entries(groqLimits).map(([m, l]) => pct((gModel[m] || { amount: 0 }).amount, l.amount)));
  // ---- dias
  const daysMap = {}; for (const r of rows) daysMap[r.day] = (daysMap[r.day] || 0) + r.neurons;
  const gDays = {}; for (const r of groq) if (r.model === "openai/gpt-oss-120b") gDays[r.day] = (gDays[r.day] || 0) + r.amount;
  const days = [...new Set([...Object.keys(daysMap), ...Object.keys(gDays)])].sort().reverse();
  $("#out").className = "";
  $("#out").innerHTML = `
  <p class="sub">Hoje: dia ${esc(today.split("-").reverse().join("/"))} (UTC) · renova em ${untilReset()}, às 21h de Brasília.</p>
  <section class="hero">
    <span class="sub">Groq: ${esc(groqMode === "principal" ? "principal (usada primeiro)" : groqMode === "reserva" ? "reserva (só quando a Cloudflare acaba)" : "sem chave cadastrada")}</span>
    <div class="big" style="color:${tone(gMax)}">${pctTxt(gMax)}<small>do modelo mais usado</small></div>
    <div class="days">${Object.entries(groqLimits).map(([m, l]) => { const u = gModel[m] || { amount: 0, calls: 0 }, p = pct(u.amount, l.amount);
      return `<div class="day gm"><span>${esc(m.replace("openai/", "").replace("-large-v3-turbo", " (microfone)"))}</span><div class="mini"><i style="width:${Math.min(100, p)}%;background:${tone(p)}"></i></div><span class="n">${pctTxt(p)}</span><span class="sub gm2">${fmt(u.amount)} de ${fmt(l.amount)} ${esc(l.unit)} · ${u.calls} de ${fmt(l.calls)} pedidos</span></div>`; }).join("")}</div>
  </section>
  <section class="hero">
    <span class="sub">Cloudflare: ${groqMode === "principal" ? "reserva (entra se a Groq falhar)" : "principal"}</span>
    <div class="big" style="color:${tone(totalPct)}">${pctTxt(totalPct)}<small>${fmt(total)} de ${fmt(free)} neurons</small></div>
    <div class="bar" role="img" aria-label="Uso da Cloudflare por pessoa">${cfUsers.map(u => `<i style="width:${Math.min(100, pct(u.neurons, free))}%;background:${color.get(u.id)}" title="${esc(name(u.id).nick)}"></i>`).join("")}</div>
  </section>
  <section>
    <h2>Por pessoa (hoje)</h2>
    ${people.length ? `<table><thead><tr><th>Pessoa</th><th class="n">Groq</th><th class="n">Cloudflare</th><th class="n">Pedidos</th></tr></thead><tbody>
    ${people.map(p => { const n = name(p.id), gp = pct(p.g.tokens, tokLimit), cp = pct(p.c.neurons, free);
      const top = Object.entries(p.c.tasks).sort((a, b) => b[1] - a[1]).map(([t, v]) => `${esc(t)} ${pctTxt(pct(v, free))}`).join(" · ");
      return `<tr><td class="who"><b><i class="dot" style="background:${color.get(p.id)}"></i>${esc(n.nick)}${n.owner ? " (você)" : ""}</b><span>@${esc(n.username)}</span>${p.g.tokens ? `<div class="tasks">Groq: ${fmt(p.g.tokens)} tokens${p.g.audio ? ` · ${fmt(p.g.audio)} s de áudio` : ""}</div>` : ""}${top ? `<div class="tasks">Cloudflare: ${top}</div>` : ""}</td><td class="n"><b>${pctTxt(gp)}</b></td><td class="n"><b>${pctTxt(cp)}</b></td><td class="n">${p.g.calls + p.c.calls}</td></tr>`; }).join("")}
    </tbody></table><p class="sub">Groq: % do limite diário de tokens do gpt-oss-120b (${fmt(tokLimit)}). Cloudflare: % dos ${fmt(free)} neurons grátis.</p>` : `<p class="sub">Ninguém usou a IA hoje ainda.</p>`}
  </section>
  <section>
    <h2>Últimos 7 dias</h2>
    <div class="days">${days.map(day => { const g = pct(gDays[day] || 0, tokLimit), c = pct(daysMap[day] || 0, free);
      return `<div class="day"><span>${esc(day.split("-").reverse().slice(0, 2).join("/"))}</span><div class="two"><div class="mini" title="Groq"><i style="width:${Math.min(100, g)}%;background:${tone(g)}"></i></div><div class="mini" title="Cloudflare"><i style="width:${Math.min(100, c)}%;background:${c >= 100 ? "var(--red)" : "var(--blue)"}"></i></div></div><span class="n">${pctTxt(g)} · ${pctTxt(c)}</span></div>`; }).join("") || '<p class="sub">Ainda sem histórico.</p>'}</div>
    <p class="sub">Em cada dia: barra de cima = Groq (gpt-oss-120b), de baixo = Cloudflare.</p>
  </section>
  <p class="sub">Tudo aqui é estimativa do app. Os números oficiais ficam no console da Groq (console.groq.com, em Limits/Usage) e no painel da Cloudflare (Workers AI). Os limites da Groq usados aqui são os do plano grátis publicados por ela; a sua conta pode ter números um pouco diferentes.</p>`;
}
$("#reload").addEventListener("click", load);
load(); setInterval(load, 30000);
}
</script>
</body>
</html>
